<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ລະບົບນັບສະຕັອກ · Potato Corner Mega Mall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6ee;--card:#fff;--head:#f4ecdc;--ink:#2a2018;--muted:#7b6c5c;--line:#e9dfcd;
  --accent:#c2410c;--accent-ink:#fff;--accent-soft:#fdeadc;--gold:#e8a317;
  --ok:#2b8a3e;--ok-soft:#e3f4e6;--warn:#b45309;--warn-soft:#fdf0d5;--bad:#c92a2a;--bad-soft:#fde4e4;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.06);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171310;--card:#221c16;--head:#2c241b;--ink:#f4ece0;--muted:#a8998a;--line:#3a3025;
    --accent:#f08a4b;--accent-ink:#1b1209;--accent-soft:#3a2a1d;--gold:#f0b73e;
    --ok:#6fcf84;--ok-soft:#1f3326;--warn:#f0b35b;--warn-soft:#3a2d17;--bad:#ff8787;--bad-soft:#3d2020;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#171310;--card:#221c16;--head:#2c241b;--ink:#f4ece0;--muted:#a8998a;--line:#3a3025;
  --accent:#f08a4b;--accent-ink:#1b1209;--accent-soft:#3a2a1d;--gold:#f0b73e;
  --ok:#6fcf84;--ok-soft:#1f3326;--warn:#f0b35b;--warn-soft:#3a2d17;--bad:#ff8787;--bad-soft:#3d2020;--shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans Lao','Noto Sans Lao Looped','Phetsarath OT','Saysettha OT','Leelawadee UI','Lao UI',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* header */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .wrap{display:flex;gap:12px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 220px}
.brand svg{flex:none}
.brand b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.brand small{color:var(--muted);font-size:12px;display:block}
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weekbar select{max-width:260px}
.save-ind{font-size:12px;color:var(--muted);white-space:nowrap}
.save-ind.err{color:var(--bad)}
.tabs{border-top:1px solid var(--line);background:var(--card)}
.tabs .wrap{display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:6px;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.tab:hover{background:var(--head)}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.tab .dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:6px;padding:0 5px}

main{padding:18px 0 80px}
.view-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.view-title h2{font-size:20px}
.view-title p{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;min-height:40px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
select{width:auto}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.row{display:grid;gap:12px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:10px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:24px;font-weight:700;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.bar{height:8px;background:var(--head);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .25s}
.bar.ok>i{background:var(--ok)}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--head);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--bad);font-weight:600}
.todo-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo-list li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.todo-list .st{display:flex;gap:10px;align-items:center}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-grid;place-items:center;font-size:13px;flex:none}
.tick.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tick.bad{border-color:var(--warn);color:var(--warn)}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:16px;-webkit-overflow-scrolling:touch}
table.sheet,table.plain{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.sheet th,.sheet td,.plain th,.plain td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
.sheet th,.plain th{background:var(--head);font-weight:600;text-align:center;font-size:12.5px;color:var(--muted)}
.sheet thead th{position:sticky;top:0;z-index:2}
.sheet td.name,.sheet th.name{position:sticky;left:0;z-index:1;text-align:left;min-width:200px;background:var(--card);border-right:1px solid var(--line)}
.sheet thead th.name{background:var(--head);z-index:3}
.sheet td.unit{text-align:left;color:var(--muted);font-size:12.5px}
.sheet tr.cat td{background:var(--head);font-weight:700;text-align:left;color:var(--ink)}
.sheet tr.tot td{font-weight:700;background:var(--head)}
.sheet td.name small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.plain td:first-child,.plain th:first-child{text-align:left}
.plain tr.tot td{font-weight:700;background:var(--head)}
input.cell{width:76px;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;min-height:30px;font-variant-numeric:tabular-nums}
input.cell:hover{border-color:var(--line)}
input.cell:focus{border-color:var(--accent);background:var(--card)}
input.cell.auto{color:var(--muted);font-style:italic}
input.cell.wide{width:104px}
input.txt{border:1px solid transparent;background:transparent;padding:3px 6px;min-height:30px;border-radius:6px;width:100%}
input.txt:hover{border-color:var(--line)}
input.txt:focus{border-color:var(--accent);background:var(--card)}
.sheet td.out-cell.flag{background:var(--bad-soft)}
.sheet td.done-cell{background:var(--ok-soft)}

/* count mode */
.count-bar{position:sticky;top:var(--hdr,112px);z-index:10;background:var(--bg);padding:8px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13.5px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.cc.done{border-left-color:var(--ok)}
.cc.todo{border-left-color:var(--gold)}
.cc.neg{border-left-color:var(--bad);background:var(--bad-soft)}
.cc .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cc .hd b{font-weight:600}
.cc .meta{font-size:12.5px;color:var(--muted)}
.cc .meta b{color:var(--ink)}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.stepper button{border:1px solid var(--line);background:var(--head);border-radius:10px;font-size:22px;cursor:pointer;min-height:46px;line-height:1}
.stepper button:active{transform:scale(.96)}
.stepper input{text-align:center;font-size:20px;font-weight:600;min-height:46px;font-variant-numeric:tabular-nums}
.cc .res{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(20,12,4,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
#modal.open{display:flex}
#modal .sheetbox{background:var(--card);border-radius:18px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#modal h3{font-size:18px;margin-bottom:12px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:120;max-width:90vw;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hint{font-size:12.5px;color:var(--muted)}
.sp{height:10px}
.right{text-align:right}
.hide{display:none!important}
.sale-line{display:grid;grid-template-columns:1fr 120px 150px 36px;gap:8px;align-items:center;margin-bottom:8px}
@media(max-width:700px){
  .top{position:static}
  .count-bar{top:0}
  .brand{flex:1 1 100%}
  .weekbar{flex:1 1 100%;flex-wrap:nowrap}
  .weekbar select{flex:1 1 0;max-width:none;min-width:0;width:0}
  .weekbar .btn{flex:none;padding:8px 10px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:18px}
  .view-title h2{font-size:18px}
}
@media(max-width:640px){
  .sale-line{grid-template-columns:1fr 1fr;}
  .sale-line input:first-child{grid-column:1/-1}
  main{padding-top:12px}
  .kpi .val{font-size:21px}
}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  .top,.tabs,main,#toast,#modal{display:none!important}
  #printArea{display:block!important;font-size:12px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #444;padding:4px 6px;text-align:left}
  #printArea td.e{height:26px}
  #printArea h2{margin:0 0 4px}
}

#profitSum{overflow-x:auto}
.plain td,.plain th{white-space:normal}
.tbl-wrap .plain td,.tbl-wrap .plain th{white-space:nowrap}
@media(max-width:700px){#themeBtn{display:none}}

.pbreak{page-break-before:always}
@media print{ #printArea{font-size:12px} #printArea h2{font-size:18px} }

</style>

const weekNo = w => { const ym=w.start.slice(0,7); return sortedWeeks().filter(x=>x.start.slice(0,7)===ym && x.start<=w.start).length; };
const weekLabel = w => { const e=wEnd(w); return (w.start.slice(0,7)===e.slice(0,7)) ? `${dnum(w.start)}–${dnum(e)} ${MS[mnum(e)]}` : `${dShort(w.start)} – ${dShort(e)}`; };
const weekFull = w => `ອາທິດທີ ${weekNo(w)} · ${weekLabel(w)} ${parseD(w.start).getUTCFullYear()}`;

function curWeek(){
  const arr=sortedWeeks(); if(!arr.length) return null;
  let w = arr.find(x=>x.id===ui.wid);

    const t=toISO(new Date());

/* ---------- ສະຫຼຸບເດືອນ ---------- */
function monthsList(){ return Array.from(new Set(state.weeks.map(w=>w.start.slice(0,7)))).sort(); }
function monthAgg(ym){
  const W=sortedWeeks().filter(w=>w.start.slice(0,7)===ym);
  if(!W.length) return null;
  const first=W[0], last=W[W.length-1];
  const ids=state.items.filter(it=>it.active||W.some(w=>hasData(w,it.id)));
  const rows=ids.map(it=>{
    const cs=W.map(w=>calc(w,it.id));
    const begin=cs[0].begin, inn=cs.reduce((s,c)=>s+c.inn,0), out=cs.reduce((s,c)=>s+c.out,0);
    const lc=cs[cs.length-1], end=lc.end!=null?lc.end:lc.total;
    const usage=cs.reduce((s,c)=>s+(c.usage||0),0), cost=cs.reduce((s,c)=>s+c.cost,0);
    return {it,begin,inn,out,end,endCounted:lc.counted,usage,cost,wk:cs.map(c=>c.cost),stockV:end*lc.price};
  });
  const sales=W.reduce((a,w)=>{const s=salesOf(w);a.gross+=s.gross;a.disc+=s.disc;a.net+=s.net;return a;},{gross:0,disc:0,net:0});
  const wsums=W.map(wsum);
  const byCat={}; CATS.forEach(c=>byCat[c.id]=rows.filter(r=>r.it.cat===c.id).reduce((s,r)=>s+r.cost,0));
  const cost=Object.values(byCat).reduce((s,v)=>s+v,0);
  const wasteCost=state.waste.filter(x=>x.date.slice(0,7)===ym).reduce((s,x)=>s+wasteVal(x),0);
  return {W,first,last,rows,sales,byCat,cost,wasteCost,allCounted:wsums.every(s=>s.todo.length===0),stock:rows.reduce((s,r)=>s+r.stockV,0),wsums};
}

/* ---------- ສັ່ງຊື້ ---------- */
function usagePerDay(id){
  let u=0,d=0; sortedWeeks().forEach(w=>{ const c=calc(w,id); if(c.counted && c.usage>0){ u+=c.usage; d+=w.days; } else if(c.counted){ d+=w.days; } });
  return d>0?u/d:null;
}
function V_order(){
  const w=curWeek(); if(!w) return noWeek();
  const target=ui.target||14;
  const rows=activeItems(w).map(it=>{
    const c=calc(w,it.id), stock=c.end!=null?c.end:c.total, pd=usagePerDay(it.id);
    const needTarget = pd!=null ? Math.max(0, Math.ceil(pd*target - stock)) : null;
    const needMin = it.min!=null ? Math.max(0, Math.ceil(it.min - stock)) : 0;
    const low = it.min!=null && stock<it.min;
    return {it,stock,pd,cover:(pd>0)?stock/pd:null,low,suggest:Math.max(needMin,needTarget||0),needTarget,needMin};
  });
  const shown = ui.onlyLow ? rows.filter(r=>r.low || r.suggest>0) : rows;
  return `<div class="view-title"><div><h2>ສັ່ງຊື້</h2><p>ຄຳນວນຈາກຍອດຄົງເຫຼືອຂອງ ${esc(weekFull(w))} ແລະ ອັດຕາໃຊ້ສະເລ່ຍຕໍ່ວັນ ຂອງທຸກອາທິດທີ່ນັບແລ້ວ</p></div>

  <div class="card" style="margin-bottom:14px"><div class="row cols2"><div><label class="f">ຕ້ອງການໃຫ້ມີສະຕັອກພໍໃຊ້ຈັກວັນ</label><input type="number" min="1" max="90" data-f="target" value="${target}"></div>

   <td><input class="cell" type="text" inputmode="decimal" data-min="${r.it.id}" value="${r.it.min!=null?fq(r.it.min):''}"></td>
   <td class="num"><b>${r.suggest>0?fn(r.suggest):'—'}</b></td><td>${r.low?'<span class="chip bad">ຕ່ຳກວ່າຂັ້ນຕ່ຳ</span>':''}</td></tr>`).join('')||'<tr><td colspan="8" class="muted" style="text-align:center;padding:20px">ບໍ່ມີລາຍການທີ່ຕ້ອງສັ່ງ</td></tr>'}
  </tbody></table></div>`;
}
function orderRows(){
  const w=curWeek(); const target=ui.target||14;
  return activeItems(w).map(it=>{
    const c=calc(w,it.id), stock=c.end!=null?c.end:c.total, pd=usagePerDay(it.id);
    const s=Math.max(it.min!=null?Math.ceil(it.min-stock):0, pd!=null?Math.ceil(pd*target-stock):0,0);
    return {it,stock,s};
  }).filter(r=>r.s>0);
}

  </div>`;

/* ============ ອັບເດດຄ່າທີ່ຄຳນວນແລ້ວ ໂດຍບໍ່ສ້າງ DOM ໃໝ່ ============ */
function refreshCalc(){
  const w=curWeek(); if(!w) return;
  const S=wsum(w);
  $$('[data-o]').forEach(el=>{
    const id=el.dataset.i, o=el.dataset.o, c=calc(w,id), r=w.rows[id]||{};
    switch(o){
      case 'begin': if(document.activeElement!==el){ el.value=fq(c.begin); } el.classList.toggle('auto', r.begin==null); break;
      case 'beginT': el.textContent=fn(c.begin); break;
      case 'inn': el.textContent=fn(c.inn); break;
      case 'out': el.textContent=fn(c.out); break;
      case 'total': el.textContent=fn(c.total); break;
      case 'usage': el.textContent=c.usage==null?'—':fn(c.usage); el.classList.toggle('neg',c.usage!=null&&c.usage<-1e-9); break;
      case 'cost': el.textContent=c.usage==null?'—':fm(c.cost); break;
      case 'endcell': el.classList.toggle('flag',c.usage!=null&&c.usage<-1e-9); el.classList.toggle('done-cell',c.counted&&!(c.usage<-1e-9)&&c.end!=null); break;
      case 'status': {
        const neg=c.usage!=null&&c.usage<-1e-9;
        el.textContent = neg?'ນັບເກີນຍອດຄາດ':(c.end!=null?'ນັບແລ້ວ':(c.counted?'ບໍ່ມີຂອງ':'ຍັງບໍ່ໄດ້ນັບ'));
        el.className='chip '+(neg?'bad':(c.counted?'ok':'warn')); break; }
      case 'card': {
        const neg=c.usage!=null&&c.usage<-1e-9;
        el.classList.toggle('neg',neg); el.classList.toggle('done',c.counted&&!neg); el.classList.toggle('todo',!c.counted); break; }
    }
  });
  $$('[data-ct]').forEach(el=>{
    const b=S.by[el.dataset.cat];
    el.textContent = el.dataset.ct==='cost' ? fm(b.cost) : `${b.counted}/${b.count}`;
  });
  const pt=$('#prog-txt'); if(pt){ pt.textContent=`ນັບແລ້ວ ${S.counted} / ${S.count} ລາຍການ`; $('#prog-bar').style.width=(S.count?Math.round(S.counted/S.count*100):0)+'%'; $('#prog-wrap').classList.toggle('ok',S.counted>=S.count); $('#prog-cost').textContent=fm(S.cost); }
  const tr=$('#tgtRes'); if(tr){ tr.innerHTML=targetHTML(w); const T=targetInfo(w), SL=salesOf(w);
    $$('[data-dt]').forEach(el=>{ el.textContent=fm(el.dataset.dt==='all'?T.target:T.perT); });
    $$('[data-dp]').forEach(el=>{ const k=el.dataset.dp; if(k==='all'){ el.textContent=fp(T.pct); } else { const v=w.daily&&w.daily[+k]; el.textContent=(v!=null&&T.perT>0)?fp(v/T.perT):'—'; el.classList.toggle('neg',v!=null&&T.perT>0&&v<T.perT); } });
    const ds=$('[data-dsum]'); if(ds) ds.textContent=fm(SL.dsum); }
  const ps=$('#profitSum'); if(ps) ps.innerHTML=profitSummary(w);
  // ປ້າຍຕົວເລກແຈ້ງເຕືອນໃນແຖບ
  const dot=$('.tab[data-v="count"]'); if(dot){ const d=$('.dot',dot); if(S.todo.length){ if(d) d.textContent=S.todo.length; else dot.insertAdjacentHTML('beforeend',`<span class="dot">${S.todo.length}</span>`); } else if(d) d.remove(); }
}

/* ============ ການດຳເນີນງານ ============ */
function openNewWeek(){
  const arr=sortedWeeks(); const last=arr[arr.length-1];
  const start = last ? addDays(wEnd(last),1) : toISO(new Date());
  const days = Math.min(7, (parseD(monthEnd(start))-parseD(start))/864e5+1);
  const unc = last ? wsum(last).todo.length : 0;
  openModal(`<h3>ເປີດອາທິດໃໝ່</h3>
   ${unc?`<div class="banner warn">ອາທິດຫຼ້າສຸດຍັງບໍ່ໄດ້ນັບ ${unc} ລາຍການ — ຍອດຍົກມາຂອງລາຍການເຫຼົ່ານັ້ນຈະໃຊ້ "ຍອດຄາດວ່າເຫຼືອ"</div>`:''}
   <div class="row cols2"><div><label class="f">ວັນເລີ່ມຕົ້ນ</label><input type="date" id="nwStart" value="${start}"></div><div><label class="f">ຈຳນວນວັນ (1–7)</label><input type="number" id="nwDays" min="1" max="7" value="${days}"></div></div>
   <p class="hint" id="nwPrev"></p>
   <p class="hint">ອາທິດຂອງຮ້ານນັບ ອັງຄານ → ຈັນ. ຖ້າອາທິດຂ້າມເດືອນ ໃຫ້ຕັດຢູ່ວັນສຸດທ້າຍຂອງເດືອນ ແລ້ວເປີດອາທິດຕໍ່ໄປຕາມເດືອນໃໝ່. ຍອດຍົກມາ = ຍອດນັບທ້າຍອາທິດກ່ອນ. ລາຄາຖືກຄັດລອກຈາກລາຍການສິນຄ້າ.</p>
   <div class="mfoot"><button class="btn" data-act="closeModal">ຍົກເລີກ</button><button class="btn primary" data-act="createWeek">ສ້າງອາທິດ</button></div>`);
  const upd=()=>{ const s=$('#nwStart').value, d=Math.max(1,Math.min(7,+$('#nwDays').value||1)); if(s) $('#nwPrev').textContent=`${WD[dow(s)]} ${dShort(s)} → ${WD[dow(addDays(s,d-1))]} ${dShort(addDays(s,d-1))}`; };
  $('#nwStart').oninput=upd; $('#nwDays').oninput=upd; upd();
}
function createWeek(){
  const start=$('#nwStart').value; const days=Math.max(1,Math.min(7,Math.round(+$('#nwDays').value||7)));
  if(!start){ toast('ກະລຸນາເລືອກວັນເລີ່ມຕົ້ນ'); return; }
  const end=addDays(start,days-1);
  if(state.weeks.some(w=>!(end<w.start||start>wEnd(w)))){ toast('ວັນທີຊ້ອນກັບອາທິດທີ່ມີຢູ່ແລ້ວ'); return; }
  const last=sortedWeeks().filter(w=>w.start<start).pop();
  const lines = (last&&last.sales&&last.sales.lines || SEED.weeks[0].sales.lines).map(l=>({id:l.id,label:l.label,g:l.g,amount:null}));
  const rows={}; state.items.filter(i=>i.active).forEach(it=>{ rows[it.id]={begin:null,tfIn:null,d:[],tfOut:null,end:null,price:it.price}; });
  const w={id:uid('w'),start,days,by:state.settings.staff,locked:false,rows,sales:{lines,discount:0},labour:{},note:'',target:last?n0(last.target):0,daily:[]};
  state.weeks.push(w); ui.wid=w.id; saveUI(); save(); closeModal();
  if(last && last.start.slice(0,7)!==start.slice(0,7)) ui.month=start.slice(0,7);
  toast('ເປີດອາທິດໃໝ່ແລ້ວ — ຍອດຍົກມາດຶງຈາກຍອດນັບອາທິດກ່ອນ'); setTab('count');
}
function setTab(t){ ui.tab=t; saveUI(); render(); window.scrollTo({top:0}); }
function setRow(w,id,k,val){
  const r=rowOf(w,id,true);
  if(k==='begin'||k==='tfIn'||k==='tfOut'||k==='end'||k==='price') r[k]=val;
  else if(/^d\d$/.test(k)){ const i=+k.slice(1); r.d=r.d||[]; while(r.d.length<=i) r.d.push(null); r.d[i]=val; }
}
function onCell(t){
  const w=curWeek(); if(!w||w.locked) return;
  const v=parseExpr(t.value);
  const id=t.dataset.i, k=t.dataset.k, cur=(w.rows[id]||{})[k];
  if(Number.isNaN(v)){ toast('ພິມໄດ້ສະເພາະຕົວເລກ ຫຼື ສູດ ເຊັ່ນ 27*50+31'); t.value=fq(k.startsWith('d')?(((w.rows[id]||{}).d||[])[+k.slice(1)]):cur); return; }
  if(k==='price'){
    const val = v==null?0:v; setRow(w,id,'price',val); const it=itemById(id); if(it) it.price=val;
  } else setRow(w,id,k,v);
  t.value = v==null?'':(k==='price'?fi(v):fq(v));
  save(); refreshCalc();
  if(k==='end') renderChromeBadge();
}
function renderChromeBadge(){ /* ຕົວເລກແຈ້ງເຕືອນຢູ່ໃນ refreshCalc ແລ້ວ */ }
function onField(t){
  const f=t.dataset.f, w=curWeek();
  const needW = ['wTarget','discount','labCost','labHours','note','weekBy'];
  if(needW.includes(f)){
    if(!w||w.locked) return;
    if(f==='note'||f==='weekBy'){ if(f==='note') w.note=t.value; else w.by=t.value; save(); return; }
    const v=parseExpr(t.value); if(Number.isNaN(v)){ toast('ຕົວເລກບໍ່ຖືກຕ້ອງ'); return; }
    if(f==='wTarget'){ w.target=v||0; }
    if(f==='discount'){ w.sales.discount=v||0; }
    if(f==='labCost'){ w.labour=w.labour||{}; w.labour.cost=v; }
    if(f==='labHours'){ w.labour=w.labour||{}; w.labour.hours=v; }
    t.value=v==null?'':fi(v); save(); refreshCalc(); return;
  }
  if(f==='remindOn'){ state.settings.remindOn=t.checked; save(); render(); return; }
  if(f==='remindTime'){ state.settings.remindTime=t.value||'08:00'; state.settings.lastNotify=''; save(); return; }
  if(f==='branch'){ state.settings.branch=t.value; save(); renderChrome(); return; }
  if(f==='staff'){ state.settings.staff=t.value; save(); return; }
  if(f==='todo'){ ui.todo=t.checked; saveUI(); render(); return; }
  if(f==='poOnly'){ ui.poOnly=t.checked; saveUI(); render(); return; }
  if(f==='onlyLow'){ ui.onlyLow=t.checked; saveUI(); render(); return; }
  if(f==='target'){ ui.target=Math.max(1,Math.min(90,+t.value||14)); saveUI(); render(); return; }
  if(f==='month'){ ui.month=t.value; saveUI(); render(); return; }
  if(f==='wmonth'){ ui.wmonth=t.value; saveUI(); render(); return; }
}
function lockWeek(on){ const w=curWeek(); if(!w) return; w.locked=on; save(); render(); toast(on?'ລັອກອາທິດແລ້ວ':'ປົດລັອກແລ້ວ'); }

/* ໜ້າຕ່າງຮັບເຂົ້າ */

function saveReceive(){
  const w=curWeek(); if(!w||w.locked) return;

  const id=$('#rcItem').value, d=$('#rcDay').value, r=rowOf(w,id,true), it=itemById(id);

}
/* ຄິດໄລ່ກ່ອງ */

function weekCSV(w){

  const rows=[[`${state.settings.branch}`,weekFull(w)],['ໝວດ','ລາຍການ','ໜ່ວຍ','ຍອດຍົກມາ','ໂອນເຂົ້າ',...days.map(d=>`${WD[dow(d)]} ${dnum(d)}`),'ໂອນອອກ','ລວມ','ນັບໄດ້ຈິງ','ໃຊ້ໄປ','ລາຄາ/ໜ່ວຍ','ມູນຄ່າ']];
  CATS.forEach(c=>activeItems(w).filter(i=>i.cat===c.id).forEach(it=>{ const c2=calc(w,it.id), r=w.rows[it.id]||{d:[]};
    rows.push([c.en,it.name,it.unit,c2.begin,r.tfIn??'',...days.map((_,k)=>(r.d&&r.d[k])??''),r.tfOut??'',c2.total,c2.end??'',c2.usage??'',c2.price,c2.usage!=null?Math.round(c2.cost):'']); }));
  const S=wsum(w); rows.push([],['ຕົ້ນທຶນລວມ','','','','','','','','','','','',Math.round(S.cost)]);
  return rows;
}

}

  secs.forEach(s=>{ t+=`\n[${s.o.name}]\n`+s.rows.map(r=>`- ${r.it.name}${r.it.barcode?' ('+r.it.barcode+')':''}: ${fn(r.qty)} ${r.it.unit}`).join('\n')+'\n'; });
  t+=`\nລວມ ${fm(poTotal(po))} ₭`;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('ຄັດລອກແລ້ວ'),()=>openModal(`<h3>ຄັດລອກ</h3><textarea rows="14" style="width:100%">${esc(t)}</textarea><div class="mfoot"><button class="btn" data-act="closeModal">ປິດ</button></div>`));
}
function poCSV(po){
  const rows=[['ເລກທີ່',po.no,'ວັນທີສັ່ງ',po.date,'ວັນຮັບເຄື່ອງ',po.delivery],['ຜູ້ສະໜອງ',po.supplier,'ຜູ້ສັ່ງ',po.orderer,'ສາຂາ',po.branch],[],['ປະເພດ','ບາໂຄດ','ລາຍການ','ໜ່ວຍ','ຈຳນວນ','ລາຄາ','ລວມ']];
  poBySection(po).forEach(s=>s.rows.forEach(r=>rows.push([s.o.name,r.it.barcode,r.it.name,r.it.unit,r.qty,r.price,Math.round(r.qty*r.price)])));
  rows.push([],['ລວມທັງໝົດ','','','','','',Math.round(poTotal(po))]); download(`${po.no}.csv`,toCSV(rows),'text/csv');
}
function poReceive(po){
  const lines=poLinesOf(po); if(!lines.length){ toast('ຍັງບໍ່ມີລາຍການທີ່ສັ່ງ'); return; }
  const d=toISO(new Date())<po.delivery?toISO(new Date()):po.delivery;
  openModal(`<h3>ຮັບເຄື່ອງເຂົ້າສະຕັອກ</h3><p>ບັນທຶກ ${lines.length} ລາຍການ ເຂົ້າຊ່ອງ "ຮັບເຂົ້າ" ຂອງອາທິດທີ່ກົງກັບວັນທີຮັບເຄື່ອງ.</p><label class="f">ວັນທີຮັບເຄື່ອງຈິງ</label><input type="date" id="rvDate" value="${po.delivery}">
   <div class="mfoot"><button class="btn" data-act="closeModal">ຍົກເລີກ</button><button class="btn primary" id="rvOk">ຢືນຢັນຮັບເຂົ້າ</button></div>`);
  $('#rvOk').onclick=()=>{
    const dt=$('#rvDate').value; const w=sortedWeeks().find(x=>dt>=x.start&&dt<=wEnd(x));
    if(!w){ toast('ບໍ່ມີອາທິດທີ່ຄອບຄຸມວັນທີນີ້ — ເປີດອາທິດກ່ອນ'); return; } if(w.locked){ toast('ອາທິດນັ້ນຖືກລັອກ — ປົດລັອກກ່ອນ'); return; }
    const k=Math.round((parseD(dt)-parseD(w.start))/864e5);
    lines.forEach(([id,l])=>{ const r=rowOf(w,id,true); r.d=r.d||[]; while(r.d.length<=k) r.d.push(null); r.d[k]=n0(r.d[k])+n0(l.qty); });
    po.status='received'; po.receivedDate=dt; save(); closeModal(); render(); toast('ຮັບເຂົ້າສະຕັອກແລ້ວ ('+weekLabel(w)+')');
  };
}

/* ============ ແຈ້ງເຕືອນນັບສະຕັອກວັນຈັນ ============ */
function remindHTML(){
  if(!state.settings.remindOn) return '';
  const t=toISO(new Date()), d=dow(t), arr=sortedWeeks(); if(!arr.length) return '';
  const w=arr.find(x=>t>=x.start&&t<=wEnd(x)) || arr[arr.length-1];
  const S=wsum(w);
  if(d===1){
    return S.todo.length
      ? `<div class="banner bad"><span><b>ວັນນີ້ວັນຈັນ — ມື້ນັບສະຕັອກ!</b> ອາທິດນີ້ຍັງເຫຼືອ ${S.todo.length} ລາຍການທີ່ຍັງບໍ່ໄດ້ນັບ</span><button class="btn sm primary" data-act="goCount">ໄປນັບສະຕັອກ</button></div>`
      : `<div class="banner info"><span>ວັນນີ້ວັນຈັນ — ນັບສະຕັອກຄົບທຸກລາຍການແລ້ວ ✓ ຢ່າລືມລັອກອາທິດ ແລະ ເປີດອາທິດໃໝ່</span></div>`;
  }
  if(t>wEnd(w) && S.todo.length) return `<div class="banner warn"><span><b>ເກີນກຳນົດນັບ:</b> ${esc(weekFull(w))} ຈົບແລ້ວ ແຕ່ຍັງບໍ່ໄດ້ນັບ ${S.todo.length} ລາຍການ</span><button class="btn sm" data-act="goCount">ໄປນັບ</button></div>`;
  if(ui.tab==='overview'||ui.tab==='count'){ const k=(8-d)%7||7; return `<p class="hint" style="margin:0 0 10px">ວັນນັບສະຕັອກຖັດໄປ: ວັນຈັນ ທີ ${dShort(addDays(t,k))} (ອີກ ${k} ວັນ)</p>`; }
  return '';
}
function notifStateText(){
  if(!('Notification' in window)) return 'browser ນີ້ບໍ່ຮອງຮັບການແຈ້ງເຕືອນ — ໃຫ້ໃຊ້ໄຟລ໌ .ics ແທນ';
  return {granted:'ສະຖານະ: ອະນຸຍາດແລ້ວ ✓',denied:'ສະຖານະ: ຖືກບລັອກ — ເປີດອະນຸຍາດໃນການຕັ້ງຄ່າ browser',default:'ສະຖານະ: ຍັງບໍ່ໄດ້ອະນຸຍາດ'}[Notification.permission];
}
function enableNotif(){
  if(!('Notification' in window)){ toast('browser ນີ້ບໍ່ຮອງຮັບ'); return; }
  Notification.requestPermission().then(p=>{ const el=$('#notifState'); if(el) el.textContent=notifStateText(); if(p==='granted'){ new Notification('ເປີດການແຈ້ງເຕືອນແລ້ວ',{body:'ຈະເຕືອນນັບສະຕັອກທຸກວັນຈັນ ຕາມເວລາທີ່ຕັ້ງ'}); } });
}
function checkNotify(){
  const s=state.settings; if(!s.remindOn||!('Notification' in window)||Notification.permission!=='granted') return;
  const now=new Date(); if(now.getDay()!==1) return;
  const [h,m]=(s.remindTime||'08:00').split(':').map(Number); if(now.getHours()*60+now.getMinutes()<h*60+m) return;
  const t=toISO(now); if(s.lastNotify===t) return;
  const w=curWeek(); const S=w?wsum(w):null; if(S&&S.todo.length===0) return;
  s.lastNotify=t; save();
  try{ new Notification('ວັນຈັນ — ມື້ນັບສະຕັອກ',{body:S?`ຍັງເຫຼືອ ${S.todo.length} ລາຍການທີ່ຍັງບໍ່ໄດ້ນັບ`:'ເຖິງເວລານັບສະຕັອກປະຈຳອາທິດແລ້ວ'}); }catch(e){}
}
function downloadICS(){
  const [h,m]=(state.settings.remindTime||'08:00').split(':'); const t=toISO(new Date()); const k=(8-dow(t))%7; const first=addDays(t,k).replace(/-/g,'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PotatoCorner Inventory//LO','BEGIN:VEVENT','UID:pc-monday-count@inventory','DTSTAMP:'+t.replace(/-/g,'')+'T000000Z',
   `DTSTART:${first}T${h}${m}00`,`DTEND:${first}T${h}${m}00`.replace(/T(\d\d)(\d\d)00$/,(x,a,b)=>`T${a}${b}00`),'RRULE:FREQ=WEEKLY;BYDAY=MO','SUMMARY:ນັບສະຕັອກ '+state.settings.branch,'DESCRIPTION:ວັນຈັນ — ມື້ນັບສະຕັອກປະຈຳອາທິດ ແລະ ເຮັດໃບສັ່ງຊື້',
   'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:ນັບສະຕັອກ','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  download('monday-stock-count.ics',ics,'text/calendar'); toast('ດາວໂຫຼດແລ້ວ — ເປີດໄຟລ໌ເພື່ອເພີ່ມເຂົ້າປະຕິທິນ');
}
setInterval(()=>{ try{ checkNotify(); }catch(e){} },60000);

/* ============ ເລີ່ມຕົ້ນ ============ */
state = load(); ui = loadUI();
$('#themeBtn').addEventListener('click',()=>{ const cur=document.documentElement.dataset.theme; const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches; document.documentElement.dataset.theme=dark?'light':'dark'; try{localStorage.setItem('pc_theme',dark?'light':'dark')}catch(e){} });
try{ const th=localStorage.getItem('pc_theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
if(!storageOK) setSaveInd('ບຣາວເຊີບໍ່ອະນຸຍາດບັນທຶກ — ໃຫ້ດາວໂຫຼດສຳຮອງເປັນປະຈຳ', true);
render(); checkNotify();
window.addEventListener('resize',()=>{ const hdr=$('.top'); if(hdr) document.documentElement.style.setProperty('--hdr',(hdr.offsetHeight-1)+'px'); });

</script>
